site_name: Python Personal Revision Guide
site_description: A comprehensive guide to Python execution, core runtime, and system composition.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocs-jupyter

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Chapters:
    - Chapter 1 - Python Execution & Core Runtime: chapter-1.md
    - Chapter 2 - The Python Data Model & Object Protocols: chapter-2.md
    - Chapter 3 - Library Literacy, Inspection & Concurrency: chapter-3.md
    - Chapter 4 - Library Composition & Architecture: chapter-4.md
    - Chapter 5 - Codebase Dissection & Debugging: chapter-5.md
  - Labs:
    - Lab 1 - Execution Core Runtime: 01_Python_Execution_Core_Runtime_Lab.ipynb
    - Lab 2 - Data Model Protocols: 02_Python_Data_Model_Protocols_Lab.ipynb
    - Lab 3 - Library Literacy: 03_Library_Literacy_Inspection_Concurrency_Lab.ipynb
    - Lab 4 - Composition Architecture: 04_Library_Composition_Architecture_Lab.ipynb
    - Lab 5 - Debugging System Composition: 05_Codebase_Dissection_Debugging_System_Composition_Lab.ipynb
