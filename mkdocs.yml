site_name: Python Personal Revision Guide
site_description: A comprehensive guide to Python execution, core runtime, and system composition.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Chapter 1 - Python Execution & Core Runtime: chapter-1.md
  - Chapter 2 - The Python Data Model & Object Protocols: chapter-2.md
  - Chapter 3 - Library Literacy, Inspection & Concurrency: chapter-3.md
  - Chapter 4 - Library Composition & Architecture: chapter-4.md
  - Chapter 5 - Codebase Dissection & Debugging: chapter-5.md
